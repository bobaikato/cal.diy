version: 1
project:
  name: cal.com
  description: Cal.com monorepo readiness slice covering documented root contributor workflows (native dev, production start, and Docker Compose stack), plus CI-aligned lint/typecheck/test/build paths
  type: application
metadata:
  ota:
    minimum_version: "1.6.16"
execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        runtimes:
          node: ">=20.17.0"
    docker-host:
      extends: host
      requirements:
        tools:
          docker: "*"
    app:
      backend: container
      lifecycle: ephemeral
      requirements:
        runtimes:
          node: ">=20.17.0"
      attachments:
        isolated_paths:
          - node_modules
          - .yarn/cache
          - .turbo
          - apps/web/.next
      container:
        image: node:20-bookworm
        engines:
          - docker
          - podman
        resources:
          memory:
            minimum: 3GiB
            default: 4GiB
toolchains:
  node:
    version: "^20.17.0"
    package_managers:
      yarn: "4.12.0"
    fulfillment:
      source: corepack
      mode: run
env:
  sources:
    - kind: dotenv
      path: .env
  vars:
    DATABASE_URL:
      required: true
    NEXTAUTH_SECRET:
      required: true
    CALENDSO_ENCRYPTION_KEY:
      required: true
    NEXTAUTH_URL:
      required: false
    NEXT_PUBLIC_WEBAPP_URL:
      required: false
surfaces:
  web:
    kind: http
    port: 3000
    path: /
    readiness:
      kind: http
      method: GET
      path: /
      headers:
        Accept: text/html
      success:
        status:
          - 200
      body:
        contains: "<!DOCTYPE html>"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
  studio:
    kind: http
    port: 5555
    path: /
    readiness:
      kind: http
      method: GET
      path: /
      headers:
        Accept: text/html
      success:
        status:
          - 200
      body:
        contains: "<!DOCTYPE html>"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
tasks:
  setup:env:
    context: host
    description: Create `.env` from `.env.example` when missing
    notes: |
      This follows the documented local setup path in `README.md`.
      The copy is idempotent and only runs when `.env` is absent.
    category: setup
    action:
      kind: copy_if_missing
      from: .env.example
      to: .env
    effects:
      writes:
        - .env
  install:
    context: host
    description: Install monorepo dependencies with Yarn
    notes: |
      This maps to the repo's canonical install surface (`yarn`) and CI's dependency hydration path.
    category: setup
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: yarn
        mode: install
        inline_builds: true
    effects:
      writes:
        - node_modules
        - .yarn/install-state.gz
      network: true
      network_kind: dependency_hydration
    execution:
      default_mode: native
      modes:
        container:
          context: app
    requirements:
      toolchains:
        - node
  prisma:generate:
    context: host
    description: Generate Prisma client and schemas
    notes: |
      This matches the repo and CI path used before tests and builds.
    category: setup
    command:
      exe: yarn
      args:
        - prisma
        - generate
    depends_on:
      - install
    execution:
      default_mode: native
      modes:
        native:
          context: host
          command:
            exe: yarn
            args:
              - prisma
              - generate
        container:
          context: app
          command:
            exe: yarn
            args:
              - prisma
              - generate
    requirements:
      toolchains:
        - node
  lint:
    context: host
    description: Run repository lint checks
    notes: |
      Mirrors `.github/workflows/lint.yml`.
    category: test
    command:
      exe: yarn
      args:
        - lint
    depends_on:
      - install
    execution:
      default_mode: native
      modes:
        native:
          context: host
          command:
            exe: yarn
            args:
              - lint
        container:
          context: app
          command:
            exe: yarn
            args:
              - lint
    requirements:
      toolchains:
        - node
  typecheck:
    context: host
    description: Run repository type checks
    notes: |
      Mirrors `.github/workflows/check-types.yml` (`yarn type-check:ci`).
    category: test
    command:
      exe: yarn
      args:
        - type-check:ci
    depends_on:
      - install
      - prisma:generate
    execution:
      default_mode: native
      modes:
        native:
          context: host
          command:
            exe: yarn
            args:
              - type-check:ci
        container:
          context: app
          command:
            exe: yarn
            args:
              - type-check:ci
    requirements:
      toolchains:
        - node
  test:
    context: host
    description: Run unit test surface
    notes: |
      Mirrors `.github/workflows/unit-tests.yml` command surface (`yarn test -- --no-isolate`).
    category: test
    command:
      exe: yarn
      args:
        - test
        - --
        - --no-isolate
    depends_on:
      - install
      - prisma:generate
    execution:
      default_mode: native
      modes:
        native:
          context: host
          command:
            exe: yarn
            args:
              - test
              - --
              - --no-isolate
        container:
          context: app
          command:
            exe: yarn
            args:
              - test
              - --
              - --no-isolate
    requirements:
      toolchains:
        - node
  test:timezone:
    context: host
    description: Run unit tests in CI timezone mode
    notes: |
      Mirrors the second command in `.github/workflows/unit-tests.yml`
      (`TZ=America/Los_Angeles VITEST_MODE=timezone yarn test -- --no-isolate`).
      Depends on lint + typecheck so this task represents the full CI verify chain.
    category: test
    command:
      exe: yarn
      args:
        - test
        - --
        - --no-isolate
    depends_on:
      - lint
      - typecheck
      - test
    execution:
      default_mode: native
      modes:
        native:
          context: host
          command:
            exe: yarn
            args:
              - test
              - --
              - --no-isolate
        container:
          context: app
          command:
            exe: yarn
            args:
              - test
              - --
              - --no-isolate
    env:
      TZ: America/Los_Angeles
      VITEST_MODE: timezone
    requirements:
      toolchains:
        - node
  build:
    context: host
    description: Run production build surface
    notes: |
      Mirrors root `yarn build` and CI production build intent.
      Requires `.env` values compatible with the target runtime.
    category: build
    command:
      exe: yarn
      args:
        - build
    depends_on:
      - install
      - prisma:generate
    execution:
      default_mode: native
      modes:
        native:
          context: host
          command:
            exe: yarn
            args:
              - build
        container:
          context: app
          command:
            exe: yarn
            args:
              - build
    requirements:
      toolchains:
        - node
    internal: true
  db:migrate:
    context: host
    description: Apply Prisma development migrations
    notes: |
      This maps to the README manual setup path (`yarn workspace @calcom/prisma db-migrate`).
      It expects an available PostgreSQL database from local setup, `yarn dx`, or Docker Compose.
    category: setup
    command:
      exe: yarn
      args:
        - workspace
        - "@calcom/prisma"
        - db-migrate
    depends_on:
      - install
      - setup:env
    effects:
      external_state:
        - database
    requirements:
      toolchains:
        - node
  db:deploy:
    context: host
    description: Apply Prisma production migrations
    notes: |
      This maps to the README production migration path (`yarn workspace @calcom/prisma db-deploy`).
      It expects an available PostgreSQL database.
    category: setup
    command:
      exe: yarn
      args:
        - workspace
        - "@calcom/prisma"
        - db-deploy
    depends_on:
      - install
      - setup:env
    effects:
      external_state:
        - database
    requirements:
      toolchains:
        - node
  dev:
    context: host
    description: Run the root development server
    notes: |
      This maps directly to `yarn dev` in the README local development flow.
      Database and env configuration must already be valid.
    category: dev
    launch:
      kind: command
      exe: yarn
      args:
        - dev
    depends_on:
      - db:migrate
    runtime:
      kind: service
      surfaces:
        - web
  start:
    context: host
    description: Run the production server from a built workspace
    notes: |
      This maps directly to the documented production startup path (`yarn build && yarn start`).
    category: prod
    launch:
      kind: command
      exe: yarn
      args:
        - start
    depends_on:
      - build
      - db:deploy
    runtime:
      kind: service
      surfaces:
        - web
  dx:
    context: host
    description: Run documented quick-start path with Docker-backed local services
    notes: |
      This follows the README `yarn dx` path that bootstraps local database state.
      It requires Docker availability on the host.
    category: dev
    launch:
      kind: command
      exe: yarn
      args:
        - dx
    depends_on:
      - install
      - setup:env
    effects:
      external_state:
        - docker
        - database
      network: true
    requirements:
      toolchains:
        - node
    runtime:
      kind: service
      surfaces:
        web:
          project:
            host:
              primary: true
  docker:up:
    context: docker-host
    description: Start the full Docker Compose stack in detached mode
    notes: |
      This maps to README Docker deployment for full stack (`docker compose up -d`).
      It launches database, redis, Cal.com app, API v2 container, and Prisma Studio.
    category: prod
    launch:
      kind: command
      exe: docker
      args:
        - compose
        - up
        - -d
    depends_on:
      - setup:env
    effects:
      external_state:
        - docker
    runtime:
      kind: service
      surfaces:
        web:
          project:
            host:
              primary: true
        studio: {}
  docker:up:studio:
    context: docker-host
    description: Start Cal.diy web + Prisma Studio against an existing database
    notes: |
      This maps to README Docker deployment command `docker compose up -d calcom studio`.
      It expects `DATABASE_URL` to point to an available database.
    category: prod
    launch:
      kind: command
      exe: docker
      args:
        - compose
        - up
        - -d
        - calcom
        - studio
    depends_on:
      - setup:env
    effects:
      external_state:
        - docker
    runtime:
      kind: service
      surfaces:
        web:
          project:
            host:
              primary: true
        studio: {}
  docker:up:app:
    context: docker-host
    description: Start the Cal.com web app compose target in detached mode
    notes: |
      This maps to README Docker deployment command `docker compose up -d calcom`.
      Docker Compose may also start `calcom` dependencies (for example `database`).
    category: prod
    launch:
      kind: command
      exe: docker
      args:
        - compose
        - up
        - -d
        - calcom
    depends_on:
      - setup:env
    effects:
      external_state:
        - docker
    runtime:
      kind: service
      surfaces:
        web:
          project:
            host:
              primary: true
  docker:down:
    context: docker-host
    description: Stop and remove the Docker Compose stack
    notes: |
      Cleanup task for local Docker workflow teardown.
    category: cleanup
    command:
      exe: docker
      args:
        - compose
        - down
    effects:
      external_state:
        - docker
workflows:
  default: dev
  verify:
    intent: ci_verification
    description: CI-aligned lint + typecheck + unit-test path
    notes: |
      This models the repo's CI verification chain:
      lint + typecheck + both unit-test workflow commands.
    prepare:
      task: setup:env
    setup:
      task: install
    run:
      task: test:timezone
  quality:
    intent: ci_verification
    description: Lint and typecheck quality gates
    notes: |
      Mirrors lint and type-check workflow surfaces from CI.
    prepare:
      task: setup:env
    setup:
      task: install
    run:
      task: typecheck
  build:
    intent: production_build
    description: Production build path for the root web workspace
    notes: |
      Mirrors the root `yarn build` production build surface.
    prepare:
      task: setup:env
    setup:
      task: install
    run:
      task: build
  dev:
    intent: app_development
    description: Native local development server path
    notes: |
      This is the README-native contributor path for local development (`yarn dev`).
    prepare:
      task: setup:env
    setup:
      task: db:migrate
    run:
      task: dev
    readiness:
      surfaces: [web]
    exposes:
      - surface: web
  prod:
    intent: production_runtime
    description: Native production startup from built artifacts
    notes: |
      This follows the documented native production sequence (`yarn build` then `yarn start`).
    prepare:
      task: setup:env
    setup:
      task: db:deploy
    run:
      task: start
    readiness:
      surfaces: [web]
    exposes:
      - surface: web
  quickstart:
    intent: app_development
    description: Docker-backed quick start using `yarn dx`
    notes: |
      This is the README quickstart that relies on Docker Compose-backed local services.
    prepare:
      task: setup:env
    setup:
      task: install
    run:
      task: dx
    readiness:
      surfaces: [web]
    exposes:
      - surface: web
  docker:
    intent: packaged_runtime
    description: Full Docker Compose deployment path
    notes: |
      This maps to README deployment command `docker compose up -d`.
    prepare:
      task: setup:env
    run:
      task: docker:up
    readiness:
      surfaces: [web, studio]
    exposes:
      - surface: web
      - surface: studio
  docker:remote-db:
    intent: packaged_runtime
    description: Docker Compose web + studio path against a remote database
    notes: |
      This maps to README deployment command `docker compose up -d calcom studio`.
    prepare:
      task: setup:env
    run:
      task: docker:up:studio
    readiness:
      surfaces: [web, studio]
    exposes:
      - surface: web
      - surface: studio
  docker:app:
    intent: packaged_runtime
    description: Docker Compose web-only deployment path
    notes: |
      This maps to README deployment command `docker compose up -d calcom`.
    prepare:
      task: setup:env
    run:
      task: docker:up:app
    readiness:
      surfaces: [web]
    exposes:
      - surface: web
agent:
  entrypoint: install
  default_task: typecheck
  safe_tasks: []
  protected_paths:
    - ota.yaml
    - package.json
    - yarn.lock
    - .env
    - .env.*
    - gh.env
    - .github/workflows
  writable_paths:
    - node_modules
    - .yarn
    - .turbo
    - apps
    - packages
    - scripts
    - docs
    - .changeset
  verify_after_changes:
    - lint
    - typecheck
    - test
  bootstrap:
    ota:
      note: Install ota when missing so contributors and agents can run the readiness workflows declared in this contract.
      sh: curl -fsSL https://dist.ota.run/install.sh | OTA_GIT_REV=08c270351c9870c82a39899161388bb250ad23c4 sh -s -- --from-git
      powershell: $env:OTA_GIT_REV='08c270351c9870c82a39899161388bb250ad23c4'; & ([scriptblock]::Create((irm https://dist.ota.run/install.ps1))) -FromGit
  notes: |
    Use `ota tasks --use .` to list runnable tasks and review the agent-safe surface before execution.
    Use `ota run setup:env .` before workflow runs so `.env`/`gh.env` are created when missing.
    Use `ota up --workflow verify --native .` for CI-aligned validation.
    Use `ota up --workflow quality --native .` for lint + typecheck gates.
    Use `ota up --workflow dev --native .` for the canonical local `yarn dev` path.
    Use `ota up --workflow build --native .` or `ota up --workflow prod --native .`
    for production-oriented build/start validation.
    Use `ota up --workflow quickstart --native .`, `ota up --workflow docker --native .`,
    `ota up --workflow docker:remote-db --native .`, and `ota up --workflow docker:app --native .`
    for the documented Docker-backed paths.
    No tasks are agent-safe by default in this slice.
