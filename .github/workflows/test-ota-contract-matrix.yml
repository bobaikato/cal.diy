name: "Test: Ota contract matrix"

on:
  workflow_dispatch:
    inputs:
      ota_repository:
        description: Ota source repository to build for this matrix run
        required: false
        default: ota-run/ota
      ota_ref:
        description: Ota branch, tag, or commit to build for this matrix run
        required: false
        default: bobai/gap3-smoke-verdict-contract
  pull_request:
    paths:
      - "ota.yaml"
      - ".github/workflows/test-ota-contract-matrix.yml"
  push:
    paths:
      - "ota.yaml"
      - ".github/workflows/test-ota-contract-matrix.yml"

concurrency:
  group: ota-contract-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OTA_NO_UPDATE_CHECK: "1"

jobs:
  native:
    name: Ota Contract Matrix (Cross-OS + Ubuntu Runtime - ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CALENDSO_ENCRYPTION_KEY: calcom_ci_encryption_key_2026
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/calcom
      NEXTAUTH_SECRET: calcom_ci_nextauth_secret_2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-bash
            os: ubuntu-latest
            run_shell: bash
            docker_ready: true
            full_proof: true
          - name: macos-bash
            os: macos-latest
            run_shell: bash
            docker_ready: false
            full_proof: false
          - name: windows-pwsh
            os: windows-latest
            run_shell: pwsh
            docker_ready: false
            full_proof: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Resolve contract minimum ota version [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          minimum_version=$(awk -F'"' '/minimum_version:/ {print $2; exit}' ota.yaml)
          if [ -z "${minimum_version}" ]; then
            echo "missing metadata.ota.minimum_version in ota.yaml"
            exit 1
          fi
          echo "minimum-version=${minimum_version}" >> "${GITHUB_OUTPUT}"
        id: contract-ota-bash

      - name: Resolve contract minimum ota version [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          $line = Select-String -Path ota.yaml -Pattern 'minimum_version:\s*"(.*?)"' | Select-Object -First 1
          if (-not $line) {
            Write-Error "missing metadata.ota.minimum_version in ota.yaml"
            exit 1
          }
          $minimumVersion = $line.Matches[0].Groups[1].Value
          "minimum-version=$minimumVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: contract-ota-pwsh

      - name: Install ota from source
        uses: ota-run/ota/.github/actions/install-ota-from-source@v1.6.16
        with:
          repository: ${{ github.event.inputs.ota_repository || 'ota-run/ota' }}
          ref: ${{ github.event.inputs.ota_ref || 'bobai/gap3-smoke-verdict-contract' }}

      - name: Verify ota install [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          ota --version
          ota --version --json > ota-version.json
          semver=$(python3 -c 'import json; print(json.load(open("ota-version.json", encoding="utf-8"))["semver"])')
          minimum="${{ steps.contract-ota-bash.outputs.minimum-version }}"
          python3 - "$semver" "$minimum" <<'PY'
          import sys
          actual = sys.argv[1]
          minimum = sys.argv[2]
          def parts(v):
              return [int(x) for x in v.split("-")[0].split(".")]
          ap = parts(actual)
          mp = parts(minimum)
          while len(ap) < 3:
              ap.append(0)
          while len(mp) < 3:
              mp.append(0)
          if ap < mp:
              print(f"expected ota semver >= {minimum}, got {actual}")
              raise SystemExit(1)
          PY

      - name: Verify ota install [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          ota --version
          & ota --version --json | Out-File -Encoding utf8 ota-version.json
          $version = (Get-Content ota-version.json -Raw | ConvertFrom-Json).semver
          $minimum = "${{ steps.contract-ota-pwsh.outputs.minimum-version }}"
          $parse = {
            param([string]$v)
            ($v.Split('-')[0].Split('.') | ForEach-Object { [int]$_ })
          }
          $actualParts = & $parse $version
          $minimumParts = & $parse $minimum
          while ($actualParts.Count -lt 3) { $actualParts += 0 }
          while ($minimumParts.Count -lt 3) { $minimumParts += 0 }
          $below = $false
          for ($i = 0; $i -lt 3; $i++) {
            if ($actualParts[$i] -lt $minimumParts[$i]) { $below = $true; break }
            if ($actualParts[$i] -gt $minimumParts[$i]) { break }
          }
          if ($below) {
            Write-Error "expected ota semver >= $minimum, got $version"
            exit 1
          }

      - name: Validate contract [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          ota validate --json . > ota-validate.json
          ota validate .

      - name: Validate contract [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          & ota validate --json . | Out-File -Encoding utf8 ota-validate.json
          ota validate .

      - name: List workflow tasks [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          ota tasks --json . > ota-tasks.json
          cat ota-tasks.json
          ota tasks --workflow verify .
          ota tasks --workflow quality .
          ota tasks --workflow build .
          ota tasks --workflow dev .
          ota tasks --workflow prod .
          ota tasks --workflow quickstart .
          ota tasks --workflow docker .
          ota tasks --workflow docker:remote-db .
          ota tasks --workflow docker:app .

      - name: List workflow tasks [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          & ota tasks --json . | Out-File -Encoding utf8 ota-tasks.json
          Get-Content ota-tasks.json
          ota tasks --workflow verify .
          ota tasks --workflow quality .
          ota tasks --workflow build .
          ota tasks --workflow dev .
          ota tasks --workflow prod .
          ota tasks --workflow quickstart .
          ota tasks --workflow docker .
          ota tasks --workflow docker:remote-db .
          ota tasks --workflow docker:app .

      - name: Export execution topology [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          ota execution topology --json . > ota-execution-topology.json
          cat ota-execution-topology.json

      - name: Export execution topology [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          & ota execution topology --json . | Out-File -Encoding utf8 ota-execution-topology.json
          Get-Content ota-execution-topology.json

      - name: Doctor verify workflow + annotations [bash]
        if: matrix.run_shell == 'bash'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ota doctor --workflow verify --json . > ota-doctor-verify.json
          doctor_status=$?
          set -e
          ota annotations --mode doctor --format github --input ota-doctor-verify.json
          exit $doctor_status

      - name: Doctor verify workflow + annotations [pwsh]
        if: matrix.run_shell == 'pwsh'
        continue-on-error: true
        shell: pwsh
        run: |
          & ota doctor --workflow verify --json . | Out-File -Encoding utf8 ota-doctor-verify.json
          $doctor_status = $LASTEXITCODE
          ota annotations --mode doctor --format github --input ota-doctor-verify.json
          if ($doctor_status -ne 0) {
            exit $doctor_status
          }

      - name: Pre-run proof (run/up dry-run JSON) [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          ota run typecheck --dry-run --json . > ota-run-default-dry-run.json
          ota run test:timezone --dry-run --json . > ota-run-verify-dry-run.json
          ota up --dry-run --json . > ota-up-default-dry-run.json
          ota up --workflow verify --native --dry-run --json . > ota-up-verify-native-dry-run.json
          ota up --workflow quality --native --dry-run --json . > ota-up-quality-native-dry-run.json
          ota up --workflow build --native --dry-run --json . > ota-up-build-native-dry-run.json
          ota up --workflow dev --native --dry-run --json . > ota-up-dev-native-dry-run.json
          ota up --workflow prod --native --dry-run --json . > ota-up-prod-native-dry-run.json

      - name: Validate pre-run JSON artifacts [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          files = [
              "ota-version.json",
              "ota-validate.json",
              "ota-tasks.json",
              "ota-execution-topology.json",
              "ota-doctor-verify.json",
              "ota-run-default-dry-run.json",
              "ota-run-verify-dry-run.json",
              "ota-up-default-dry-run.json",
              "ota-up-verify-native-dry-run.json",
              "ota-up-quality-native-dry-run.json",
              "ota-up-build-native-dry-run.json",
              "ota-up-dev-native-dry-run.json",
              "ota-up-prod-native-dry-run.json",
          ]
          for path in files:
              with open(path, encoding="utf-8") as fh:
                  json.load(fh)
          print("validated pre-run JSON artifacts")
          PY

      - name: Pre-run proof (run/up dry-run JSON) [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          & ota run typecheck --dry-run --json . | Out-File -Encoding utf8 ota-run-default-dry-run.json
          & ota run test:timezone --dry-run --json . | Out-File -Encoding utf8 ota-run-verify-dry-run.json
          & ota up --dry-run --json . | Out-File -Encoding utf8 ota-up-default-dry-run.json
          & ota up --workflow verify --native --dry-run --json . | Out-File -Encoding utf8 ota-up-verify-native-dry-run.json
          & ota up --workflow quality --native --dry-run --json . | Out-File -Encoding utf8 ota-up-quality-native-dry-run.json
          & ota up --workflow build --native --dry-run --json . | Out-File -Encoding utf8 ota-up-build-native-dry-run.json
          & ota up --workflow dev --native --dry-run --json . | Out-File -Encoding utf8 ota-up-dev-native-dry-run.json
          & ota up --workflow prod --native --dry-run --json . | Out-File -Encoding utf8 ota-up-prod-native-dry-run.json

      - name: Validate pre-run JSON artifacts [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          $files = @(
            "ota-version.json",
            "ota-validate.json",
            "ota-tasks.json",
            "ota-execution-topology.json",
            "ota-doctor-verify.json",
            "ota-run-default-dry-run.json",
            "ota-run-verify-dry-run.json",
            "ota-up-default-dry-run.json",
            "ota-up-verify-native-dry-run.json",
            "ota-up-quality-native-dry-run.json",
            "ota-up-build-native-dry-run.json",
            "ota-up-dev-native-dry-run.json",
            "ota-up-prod-native-dry-run.json"
          )
          foreach ($file in $files) {
            Get-Content $file -Raw | ConvertFrom-Json | Out-Null
          }

      - name: Container planning proof (cross-OS) [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          set +e
          ota up --workflow verify --container --dry-run --json . > ota-up-verify-container-cross-os-dry-run.json
          verify_container_status=$?
          ota up --workflow build --container --dry-run --json . > ota-up-build-container-cross-os-dry-run.json
          build_container_status=$?
          set -e
          python3 - <<'PY'
          import json
          files = [
              "ota-up-verify-container-cross-os-dry-run.json",
              "ota-up-build-container-cross-os-dry-run.json",
          ]
          for path in files:
              payload = json.load(open(path, encoding="utf-8"))
              if not payload.get("dry_run") or not payload.get("status"):
                  raise SystemExit(f"invalid container dry-run payload in {path}: {payload}")
          print("validated cross-OS container dry-run JSON artifacts")
          PY
          if [ "${verify_container_status}" -ne 0 ] || [ "${build_container_status}" -ne 0 ]; then
            echo "container dry-run blocked on this host (expected on non-Ubuntu hosted runners)"
          fi

      - name: Container planning proof (cross-OS) [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          & ota up --workflow verify --container --dry-run --json . | Out-File -Encoding utf8 ota-up-verify-container-cross-os-dry-run.json
          $verifyContainerStatus = $LASTEXITCODE
          & ota up --workflow build --container --dry-run --json . | Out-File -Encoding utf8 ota-up-build-container-cross-os-dry-run.json
          $buildContainerStatus = $LASTEXITCODE
          $files = @(
            "ota-up-verify-container-cross-os-dry-run.json",
            "ota-up-build-container-cross-os-dry-run.json"
          )
          foreach ($file in $files) {
            $payload = Get-Content $file -Raw | ConvertFrom-Json
            if (-not $payload.dry_run -or [string]::IsNullOrWhiteSpace($payload.status)) {
              Write-Error "invalid container dry-run payload in $file"
              exit 1
            }
          }
          if ($verifyContainerStatus -ne 0 -or $buildContainerStatus -ne 0) {
            Write-Output "container dry-run blocked on this host (expected on non-Ubuntu hosted runners)"
          }
          $global:LASTEXITCODE = 0

      - name: Pre-run proof (container/dx/docker dry-run JSON) [bash]
        if: matrix.run_shell == 'bash' && matrix.docker_ready
        shell: bash
        run: |
          ota up --workflow verify --container --dry-run --json . > ota-up-verify-container-dry-run.json
          ota up --workflow build --container --dry-run --json . > ota-up-build-container-dry-run.json
          ota up --workflow quickstart --native --dry-run --json . > ota-up-quickstart-native-dry-run.json
          ota up --workflow docker --native --dry-run --json . > ota-up-docker-native-dry-run.json
          ota up --workflow docker:remote-db --native --dry-run --json . > ota-up-docker-remote-db-native-dry-run.json
          ota up --workflow docker:app --native --dry-run --json . > ota-up-docker-app-native-dry-run.json
          python3 - <<'PY'
          import json
          files = [
              "ota-up-verify-container-dry-run.json",
              "ota-up-build-container-dry-run.json",
              "ota-up-quickstart-native-dry-run.json",
              "ota-up-docker-native-dry-run.json",
              "ota-up-docker-remote-db-native-dry-run.json",
              "ota-up-docker-app-native-dry-run.json",
          ]
          for path in files:
              with open(path, encoding="utf-8") as fh:
                  json.load(fh)
          print("validated container/dx/docker dry-run JSON artifacts")
          PY

      - name: Proof verify workflow (native)
        if: matrix.run_shell == 'bash' && matrix.full_proof
        timeout-minutes: 90
        shell: bash
        run: |
          ota clean . || true
          ota proof runtime --workflow verify --json . > ota-proof-verify-native.json
          cat ota-proof-verify-native.json
          python3 -c 'import json; json.load(open("ota-proof-verify-native.json", encoding="utf-8"))'
          ota clean . || true

      - name: Proof verify workflow (container)
        if: matrix.run_shell == 'bash' && matrix.full_proof
        timeout-minutes: 90
        shell: bash
        run: |
          ota clean . || true
          ota proof runtime --workflow verify --container --json . > ota-proof-verify-container.json
          cat ota-proof-verify-container.json
          python3 -c 'import json; json.load(open("ota-proof-verify-container.json", encoding="utf-8"))'
          ota clean . || true

      - name: Upload matrix artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ota-contract-matrix-${{ matrix.name }}
          include-hidden-files: true
          path: |
            ota-validate.json
            ota-version.json
            ota-tasks.json
            ota-execution-topology.json
            ota-doctor-verify.json
            ota-run-default-dry-run.json
            ota-run-verify-dry-run.json
            ota-up-default-dry-run.json
            ota-up-verify-native-dry-run.json
            ota-up-quality-native-dry-run.json
            ota-up-build-native-dry-run.json
            ota-up-dev-native-dry-run.json
            ota-up-prod-native-dry-run.json
            ota-up-verify-container-cross-os-dry-run.json
            ota-up-build-container-cross-os-dry-run.json
            ota-up-verify-container-dry-run.json
            ota-up-build-container-dry-run.json
            ota-up-quickstart-native-dry-run.json
            ota-up-docker-native-dry-run.json
            ota-up-docker-remote-db-native-dry-run.json
            ota-up-docker-app-native-dry-run.json
            ota-proof-verify-native.json
            ota-proof-verify-container.json
            .ota/
          retention-days: 7
